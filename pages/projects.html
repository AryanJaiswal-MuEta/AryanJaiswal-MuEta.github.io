<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work - Aryan Kumar Jaiswal</title>
  <meta name="view-transition" content="same-origin" />
  <meta name="description" content="A cinematic rotation of project giants.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@300;400;600&display=swap"
    rel="stylesheet">
  <link href="../mode-toggle.css" rel="stylesheet">
  <style>
    body.light-mode {
      --bg: #eee8d5;
      --text: #333333; /* Strong charcoal gray for visibility */
      --accent: #5e5044;
      --card-bg: #ffffff;
      --card-border: rgba(107, 92, 79, 0.1);
      --card-shadow: rgba(107, 92, 79, 0.08);
      --counter-color: rgba(107, 92, 79, 0.04);
      --overlay-gradient: linear-gradient(to bottom, transparent 30%, rgba(255, 255, 255, 0.95));
      --nav-bg: rgba(255, 255, 255, 0.7);
      --nav-border: rgba(107, 92, 79, 0.15);
      --nav-text: rgba(45, 42, 39, 0.5);
    }

    :root {
      --accent: #4ade80;
      --bg: #080a09;
      --text: #e0e0e0;
      --card-bg: #121413;
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: rgba(0, 0, 0, 0.6);
      --counter-color: rgba(255, 255, 255, 0.02);
      --overlay-gradient: linear-gradient(to bottom, transparent 20%, rgba(0, 0, 0, 0.95));
      --nav-bg: rgba(255, 255, 255, 0.03);
      --nav-border: rgba(255, 255, 255, 0.08);
      --nav-text: rgba(255, 255, 255, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image:
        radial-gradient(circle at 50% -20%, rgba(74, 222, 128, 0.15), transparent 60%),
        radial-gradient(circle at 50% 120%, rgba(74, 222, 128, 0.05), transparent 60%);
    }

    /* Standardized Nav Bar */
    .nav-bar {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 30px;
      background: var(--nav-bg);
      backdrop-filter: blur(15px);
      padding: 12px 35px;
      border-radius: 50px;
      border: 1px solid var(--nav-border);
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .nav-bar a {
      color: var(--nav-text);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: 0.3s;
    }

    .nav-bar a:hover,
    .nav-bar a.active {
      color: var(--accent);
      text-shadow: 0 0 10px rgba(74, 222, 128, 0.3);
    }

    /* Carousel Container */
    .carousel-stage {
      position: relative;
      width: 100%;
      height: 100%;
      perspective: 2000px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .carousel-rail {
      position: absolute;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      will-change: transform;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Giant Flashcard */
    .giant-card {
      position: absolute;
      width: clamp(260px, 24vw, 380px);
      height: clamp(320px, 28vw, 440px);
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid var(--card-border);
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      box-shadow: 0 20px 60px var(--card-shadow);
      transform-style: preserve-3d;
      overflow: hidden;
      transition: border-color 0.4s ease;
      cursor: pointer;
    }

    .giant-card:hover {
      border-color: var(--accent);
    }

    .card-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.5;
      transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 0;
    }

    .giant-card.is-active .card-bg {
      opacity: 0.7; /* Reduced from 0.9 for better contrast */
    }

    .giant-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--overlay-gradient);
      z-index: 1;
    }

    .card-content {
      position: relative;
      z-index: 2;
    }

    .card-year {
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 2px;
      font-size: 1rem;
      margin-bottom: 5px;
    }

    .card-title {
      font-family: 'Anton', sans-serif;
      font-size: clamp(2.5rem, 4vw, 4rem);
      line-height: 0.9;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 15px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .card-desc {
      font-size: 1rem;
      color: var(--text);
      opacity: 0.9; /* Increased from 0.7 for better readability */
      line-height: 1.5;
      max-width: 300px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    /* Active State Glow */
    .giant-card.is-active {
      border-color: var(--accent);
      box-shadow: 0 0 40px rgba(74, 222, 128, 0.2), 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    /* Hints and Info */
    .scroll-hint {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0.5;
      pointer-events: none;
      z-index: 10;
    }

    .mouse {
      width: 24px;
      height: 40px;
      border: 2px solid var(--text);
      border-radius: 12px;
      position: relative;
    }

    .wheel {
      width: 2px;
      height: 8px;
      background: var(--accent);
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      animation: mouseScroll 1.5s infinite;
    }

    @keyframes mouseScroll {
      0% {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }

      100% {
        transform: translateX(-50%) translateY(15px);
        opacity: 0;
      }
    }

    .project-counter {
      position: fixed;
      left: 5vw;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'Anton', sans-serif;
      font-size: 10vw;
      color: var(--counter-color);
      line-height: 1;
      pointer-events: none;
    }

    /* Detail View */
    .detail-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start; /* Start from top to allow scrolling */
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(25px);
      transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto;
      padding: 80px 24px;
      scroll-behavior: smooth;
    }

    .detail-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .detail-content {
      width: 100%;
      max-width: 800px;
      text-align: center;
      padding-bottom: 60px;
    }

    .close-btn {
      position: absolute;
      top: 40px;
      right: 40px;
      font-size: 2rem;
      color: var(--text);
      background: none;
      border: none;
      cursor: pointer;
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      .giant-card {
        width: 80vw;
        height: 60vh;
        padding: 30px;
      }

      .card-title {
        font-size: 3rem;
      }
    }
  </style>
</head>

<body>

  <nav class="nav-bar">
    <a href="../index.html">Home</a>
    <a href="./about.html">About</a>
    <a href="./projects.html" class="active">Work</a>
    <a href="./contact.html">Contact</a>
  </nav>

  <div class="project-counter" id="counter">01</div>

  <div class="carousel-stage" id="stage">
    <div class="carousel-rail" id="rail">
      <!-- Cards will be added here -->
    </div>
  </div>

  <div class="scroll-hint">
    <div class="mouse">
      <div class="wheel"></div>
    </div>
  </div>

  <div class="detail-overlay" id="detail-view" onclick="event.target === this && closeDetails()">
    <div class="detail-content" id="detail-inner"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="../mode-toggle.js"></script>
  <script>
    const items = [
      { 
        year: "2025", 
        title: "C-Unplugged", 
        desc: "A robust CLI music management system built in C, featuring dynamic memory, file persistence, and recursive playlist logic.", 
        longDesc: "Developed a terminal-based music application designed to handle large-scale song databases and complex user flows using pure C. The project focuses on low-level system design, memory efficiency, and persistent data structures.<br><br><h4 style='margin-bottom: 20px; color: var(--accent);'>Key Functionalities:</h4><ul style='text-align: left; list-style: none; margin: 0 auto 40px; max-width: 600px; line-height: 1.8;'><li>• <strong>Album & Library Management</strong>: Browse, load, and manage song metadata with features to create, update, and delete albums.</li><li style='margin-top: 15px;'>• <strong>Persistent Storage</strong>: Implemented file I/O logic to ensure albums and library states are saved across sessions.</li><li style='margin-top: 15px;'>• <strong>Dynamic Playlists</strong>: Built a circular linked-list based playlist system supporting loop playback, skipping, and real-time management.</li><li style='margin-top: 15px;'>• <strong>Command Logging</strong>: Designed a cross-session logging system that records every user command to a history file.</li><li style='margin-top: 15px;'>• <strong>CLI Architecture</strong>: Engineered a custom command-line interface for intuitive navigation through the music ecosystem.</li></ul>",
        img: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=1200&q=80", 
        tags: ["C", "FILE I/O", "LINKED LISTS", "CLI"] 
      },
      { year: "2025", title: "TwixT Game", desc: "Terminal-based TwixT board game with ANSI grid rendering and valid-move logic. Implemented DFS-based win-path checking.", img: "https://images.unsplash.com/photo-1611996575749-79a3a250f948?auto=format&fit=crop&w=1200&q=80", tags: ["DFS", "ANSI UI", "GAME LOGIC"] },
      { year: "2025", title: "Shopping Site", desc: "E-commerce style frontend with product listing, filtering, and cart flow. Focused on storefront structure and product card hierarchy.", img: "https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1200&q=80", tags: ["E-COMMERCE", "FRONTEND", "RESPONSIVE"] },
      { 
        year: "2026", 
        title: "Presence", 
        desc: "A cinematic personal web presence built from scratch to showcase engineering projects, academic journey, and design philosophy.", 
        longDesc: "I built this portfolio to act as a cinematic window into my journey as a developer. Instead of using templates or heavy frameworks, I engineered everything from the ground up to ensure every pixel and transition feels intentional and performs flawlessly.<br><br><h4 style='margin-bottom: 20px; color: var(--accent);'>How I Built It:</h4><ul style='text-align: left; list-style: none; margin: 0 auto 40px; max-width: 600px; line-height: 1.8;'><li>• <strong>The Core Engine</strong>: Developed using <strong>Pure HTML5 and Vanilla CSS</strong>. I used <strong>CSS Custom Properties</strong> to build a unified design system that supports instant theme switching.</li><li style='margin-top: 15px;'>• <strong>Dynamic Interactions</strong>: Created the <strong>3D Project Carousel</strong> and the <strong>Typewriter effect</strong> using native <strong>JavaScript (ES6+)</strong> classes, focusing on high performance and smooth framerates.</li><li style='margin-top: 15px;'>• <strong>Cinematic Motion</strong>: Built the staggered entrance animations and scroll-reveals using <strong>Intersection Observer</strong> and <strong>CSS Keyframes</strong>, avoiding the overhead of external animation libraries.</li><li style='margin-top: 15px;'>• <strong>Responsive Architecture</strong>: Used <strong>CSS Grid</strong> and <strong>Flexbox</strong> to create a fluid layout that adapts structurally across all devices.</li></ul>",
        img: "https://images.unsplash.com/photo-1467232004584-a241de8bcf5d?auto=format&fit=crop&w=1200&q=80", 
        tags: ["VANILLA JS", "CSS GRID", "A11Y", "UI MOTION"] 
      },
      { 
        year: "2026", 
        title: "Multiplayer Arena", 
        desc: "A full-stack, real-time platform with biometric authentication, WebSocket synchronization, and automated Elo ranking.", 
        longDesc: "Built a high-performance multiplayer environment integrating biometric facial login with real-time gameplay. My focus was on the core networking and competitive logic.<br><br><h4 style='margin-bottom: 20px; color: var(--accent);'>My Contributions:</h4><ul style='text-align: left; list-style: none; margin: 0 auto 40px; max-width: 600px; line-height: 1.8;'><li>• <strong>The Synchronized Arena</strong>: Developed a real-time WebSocket game lobby and a server-authoritative Tic-Tac-Toe engine using FastAPI.</li><li style='margin-top: 15px;'>• <strong>Room Isolation</strong>: Implemented a dedicated matchmaking and challenge protocol with isolated communication rooms.</li><li style='margin-top: 15px;'>• <strong>Elo Reckoning</strong>: Architected an automated ranking system using the Elo formula for dynamic rating updates.</li><li style='margin-top: 15px;'>• <strong>Anti-Cheat Logic</strong>: Ensured all game state validations occurred server-side to prevent client manipulation.</li></ul>",
        img: "../images/tictactoe-arena.png", 
        tags: ["WEBSOCKETS", "FASTAPI", "MULTIPLAYER", "ELO SYSTEM"] 
      },
      { 
        year: "2026", 
        title: "Bank Vault", 
        desc: "A multi-layered security system demonstrating biometric liveness detection, sensor fusion, and IoT alerting.", 
        longDesc: "Securing restricted areas requires multiple verification mechanisms. This project simulates a secure vault where entry is verified using biometric pulse sensors and monitored via IR, Ultrasonic, and LDR sensors.<br><br><h4 style='margin-bottom: 20px; color: var(--accent);'>Key Features:</h4><ul style='text-align: left; list-style: none; margin: 0 auto 40px; max-width: 600px; line-height: 1.8;'><li>• <strong>Biometric Verification</strong>: Real-time liveness detection via heart rate sensor.</li><li style='margin-top: 15px;'>• <strong>Entry/Exit Tracking</strong>: IR-based sensors for precise crowd monitoring.</li><li style='margin-top: 15px;'>• <strong>Proximity Security</strong>: Ultrasonic monitoring of the inner safe box.</li><li style='margin-top: 15px;'>• <strong>Light Tampering Detection</strong>: LDR sensors to alert if the safe is opened.</li><li style='margin-top: 15px;'>• <strong>IoT Alerting</strong>: Wireless communication for instant security alerts.</li></ul>",
        img: "../images/bank-vault.png", 
        tags: ["SECURITY", "IOT", "SENSORS"] 
      }
    ];

    const rail = document.getElementById('rail');
    const counter = document.getElementById('counter');
    const detailView = document.getElementById('detail-view');
    const detailInner = document.getElementById('detail-inner');
    const cards = [];
    let rotation = 0;
    let targetRotation = 0;

    function buildCarousel() {
      items.forEach((item, i) => {
        const card = document.createElement('div');
        card.className = 'giant-card';
        card.innerHTML = `
          <img src="${item.img}" class="card-bg">
          <div class="card-content">
            <p class="card-year">${item.year}</p>
            <h2 class="card-title">${item.title}</h2>
            <p class="card-desc">${item.desc}</p>
          </div>
        `;
        card.addEventListener('click', () => {
          // If it's already in front, open details
          if (card.classList.contains('is-active')) {
            openDetails(item);
          } else {
            // Rotate to this card
            targetRotation = -i * (360 / items.length);
          }
        });
        rail.appendChild(card);
        cards.push(card);
      });
    }

    function updateCarousel() {
      rotation += (targetRotation - rotation) * 0.1;
      const angleStep = 360 / items.length;
      const radius = Math.min(window.innerWidth * 0.45, 700);

      cards.forEach((card, i) => {
        const angle = i * angleStep + rotation;
        const radian = angle * (Math.PI / 180);

        const tx = Math.sin(radian) * radius;
        const tz = Math.cos(radian) * radius;
        const ry = angle; // Facing outward

        // Opacity and focus
        const normalized = (tz + radius) / (2 * radius); // 0 at back, 1 at front
        const opacity = 0.1 + normalized * 0.9;
        const scale = 0.5 + normalized * 0.5;

        card.style.transform = `translate3d(${tx}px, 0, ${tz}px) rotateY(${ry}deg) scale(${scale})`;
        card.style.opacity = opacity;
        card.style.zIndex = Math.round(tz + radius);

        const isActive = normalized > 0.98;
        card.classList.toggle('is-active', isActive);
        if (isActive) {
          counter.textContent = (i + 1).toString().padStart(2, '0');
        }
      });

      requestAnimationFrame(updateCarousel);
    }

    // Scroll and Drag
    window.addEventListener('wheel', (e) => {
      targetRotation -= e.deltaY * 0.05;
    });

    let isDragging = false;
    let startX = 0;
    let startRot = 0;

    window.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX;
      startRot = targetRotation;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      targetRotation = startRot + dx * 0.15;
    });

    window.addEventListener('mouseup', () => isDragging = false);

    function openDetails(item) {
      detailInner.innerHTML = `
        <p style="color: var(--accent); font-weight: 600; letter-spacing: 2px; margin-bottom: 10px;">${item.year}</p>
        <h2 style="font-family: 'Anton'; font-size: clamp(2.5rem, 8vw, 5rem); line-height: 0.9; margin: 0 0 30px 0; color: var(--text);">${item.title}</h2>
        
        <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 60px;">
          ${item.tags.map(t => `
            <span style="padding: 10px 20px; background: rgba(74, 222, 128, 0.1); border: 1px solid rgba(74, 222, 128, 0.3); color: var(--accent); border-radius: 8px; font-size: 14px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;">
              ${t}
            </span>`).join('')}
        </div>

        <div style="font-size: clamp(1.1rem, 1.4vw, 1.4rem); color: var(--text); opacity: 0.85; max-width: 750px; margin: 0 auto; line-height: 1.6;">
          ${item.longDesc || item.desc}
        </div>
      `;
      detailView.classList.add('open');
    }

    function closeDetails() {
      detailView.classList.remove('open');
    }

    buildCarousel();
    updateCarousel();
  </script>
</body>

</html>
